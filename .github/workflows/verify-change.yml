name: Verify change

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base:
        description: Exact target commit or ref already contained in this candidate
        required: true

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Complete offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: offline
          POSTGRES_PASSWORD: offline-only
          POSTGRES_DB: voice_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U offline -d voice_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://offline:offline-only@127.0.0.1:5432/voice_service_test
      PYTHON_DOTENV_DISABLED: '1'
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r e2e/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Verify exact integration candidate
        run: ./scripts/verify_change.sh --base "$BASE_REF" --head "$HEAD_SHA" --output scratch/ci-verification
      - name: Retain logs, manifests, JUnit and browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: scratch/ci-verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: Merge readiness
    if: always()
    needs: [offline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base }}
      HEAD_SHA: ${{ github.sha }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: scratch/ci-verification
      - name: Require every mandatory job and validate complete exact-SHA reports
        run: >-
          python scripts/check_ci_evidence.py --offline-result "$OFFLINE_RESULT"
          --base "$BASE_REF" --head "$HEAD_SHA" --output scratch/ci-verification
