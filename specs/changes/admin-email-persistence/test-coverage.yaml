schema: 1
feature: changes/admin-email-persistence
acceptance:
- id: AC1
  behavior: A successful admin email save survives an overlapping Gmail token refresh and browser reload.
  preconditions:
  - Isolated synthetic configuration with an existing sender, recipient, and encrypted Google credentials
  - Google refresh response is held until the admin save has returned success
  success:
  - Fresh API and JSON-file reads retain the newly saved recipient and routine-copy preference
  - A successful refresh stores the new encrypted access token and expiry
  - A complete browser reload displays the newly saved recipient
  failure:
  - A rejected refresh preserves the newly saved recipient and existing token fields
  invariants:
  - Refresh token and unrelated business settings remain unchanged
  - Provider request semantics and notification policy remain unchanged
  - Configuration save emits no notification or live provider request
  tests:
  - tests/test_gmail_service.py::test_refresh_gmail_token_success
  - tests/test_admin_email_persistence.py::test_admin_email_save_survives_token_refresh[200]
  - tests/test_admin_email_persistence.py::test_admin_email_save_survives_token_refresh[403]
  - e2e/test_admin_mail_oauth.py::test_admin_email_save_survives_background_refresh_and_page_reload
  - e2e/test_admin_mail_oauth.py::test_legacy_settings_render_google_only_and_save_after_reload
  layer:
  - unit
  - http
  - browser
  - provider_contract
  - composed
  live_acceptance:
    status: not_required
    reason: The change preserves token-refresh settings and request semantics; no live provider behavior changes.
    scenarios: []
- id: AC2
  behavior: A saved admin notification email survives a reset of the service-local configuration file.
  preconditions:
  - Isolated PostgreSQL database with the admin notification settings migration applied
  - Admin email changed through the Gmail settings API
  success:
  - A fresh settings API read returns the saved database value after JSON config is restored to its pre-save value
  - System admin emails and admin calendar attendees use the saved database value
  - A failed database write returns an error and does not report a successful save
  failure:
  - A database read failure does not expose a stale JSON recipient as the current setting
  invariants:
  - The checked-in JSON recipient is used only until an admin email has first been durably saved
  - Automated provider-boundary tests issue no real Gmail or Google Calendar request
  - Notification flags, sender, OAuth credentials, and token-refresh behavior remain unchanged
  tests:
  - tests/test_admin_email_persistence.py::test_admin_email_save_survives_config_file_reset
  - tests/test_admin_email_persistence.py::test_admin_email_save_does_not_report_success_when_database_write_fails
  - tests/test_admin_email_persistence.py::test_admin_email_read_does_not_return_stale_file_value_when_database_fails
  - tests/test_admin_email_persistence.py::test_email_and_calendar_delivery_use_saved_recipient_after_file_reset
  - tests/test_migrations.py::test_booking_integrity_migrations_have_explicit_rollbacks
  - e2e/test_admin_mail_oauth.py::test_admin_email_save_survives_background_refresh_and_page_reload
  layer:
  - database
  - http
  - provider_contract
  - browser
  - migration
  live_acceptance:
    status: not_required
    reason: Automated tests use an isolated database and mocked provider boundaries; no live database or recipient is changed.
    scenarios: []
- id: AC3
  behavior: A successful warm admin configuration save reduces total database transaction overhead while persisting phone and email settings.
  preconditions:
  - Warm service process with an isolated synthetic PostgreSQL database
  - Admin save payload includes a nonblank phone so both SMS and whitelist writes are exercised
  success:
  - The save succeeds and performs no more than one pooled database checkout and its associated liveness probe
  - The synchronous endpoint is dispatched by FastAPI's worker pool and does not block the ASGI event loop
  - The successful transaction uses no redundant RELEASE SAVEPOINT SQL round-trip
  - After the measured request, fresh database reads confirm the admin phone setting, ADMIN whitelist record metadata, and admin email recipient
  failure:
  - A phone persistence failure after a phone-field write restores the prior phone value from a fresh database read and does not prevent authoritative admin email persistence
  - An admin email persistence failure returns HTTP 503 and does not report or persist a successful local configuration save
  invariants:
  - Phone writes remain best effort while admin email persistence remains authoritative
  - A concurrent non-Gmail config update during database persistence is preserved by the Gmail save
  - A concurrent Gmail update during /config database work is preserved by the config save
  - Database errors preserve the preexisting API status and response behavior
  - The budget excludes Render cold starts; production p95 latency remains unverified because current telemetry lacks request timing data
  - No provider requests or notification deliveries are triggered by saving configuration
  tests:
  - tests/test_admin_email_persistence.py::test_admin_config_save_uses_one_database_checkout
  - tests/test_admin_email_persistence.py::test_admin_config_save_uses_sync_fastapi_dispatch
  - tests/test_admin_email_persistence.py::test_admin_notification_settings_success_avoids_savepoint_release_roundtrip
  - tests/test_admin_email_persistence.py::test_admin_phone_persistence_failure_does_not_block_email_save
  - tests/test_admin_email_persistence.py::test_admin_email_save_does_not_report_success_when_database_write_fails
  - tests/test_admin_email_persistence.py::test_admin_email_save_preserves_config_updated_during_database_persistence
  - tests/test_admin_email_persistence.py::test_config_save_preserves_gmail_update_during_database_persistence
  layer:
  - http
  - database
  live_acceptance:
    status: not_required
    reason: The change combines existing PostgreSQL setting writes and removes redundant success-path transaction SQL without changing external provider or notification behavior. The checkout count is verified against a disposable synthetic database, and the success-path query regression is checked with a deterministic fake connection. Production p95 timing is unverified and Render cold starts are outside this budget.
    scenarios: []
omitted_layers:
  database: AC1 covers the token-refresh update; database-backed recipient persistence is covered by AC2.
  migration: AC1 did not change schema; the admin recipient migration is covered by AC2.
  targeted: Deterministic API, provider-boundary, and browser scenarios cover the affected persistence behavior.
review:
  red: >-
    AC1: Before implementation, the focused admin persistence command reproduced the stale recipient after a successful token refresh.
    AC2: Before durable storage, restoring the pre-save JSON file made a fresh GET return old-admin@example.test after the API returned 200 for new-admin@example.test.
    AC3: Before implementation, a phone-bearing admin save used three database checkouts; the sync-dispatch regression also failed against the async endpoint.
    Race regressions: Against the pre-fix source tree at 1df429c4fc61f3e39582b588e7179c4f6a40601e, both new deterministic interleaving tests failed because the Gmail save restored the old timezone and the /config save restored the old Gmail recipient.
  green: >-
    Exact commit 7f2b99a79494951803cdc8b13050410308cfd762 verified against target
    53ea4ce734294ec21d5334685d27ec751e3df7d8: 2518 unit/integration tests and 723 E2E tests passed,
    with zero failures, errors, skips, xfails, or xpasses. The focused AC3 suite passed all ten cases
    with one existing Starlette/httpx deprecation warning. After the race fix, both deterministic
    interleaving regressions and the database-write failure regression passed in an isolated test
    copy (3 passed), and two prompt/provider-sync behavior tests passed (2 passed). The local
    database-backed test setup remains blocked by sandbox-denied loopback PostgreSQL. Production p95
    latency and live deployment behavior remain unverified.
  test_changes: >-
    AC1 adds API and browser interleaving coverage and exact token-only update assertions. AC2 adds database reset, failed read/write, provider-boundary, migration, and browser assertions. AC3 asserts one checkout with a nonblank phone, sync FastAPI dispatch, absence of redundant success-path savepoint release, persisted phone/whitelist/email read-back, phone savepoint rollback after one row is changed, HTTP 503 behavior when email persistence fails, and both directions of concurrent Gmail/config updates. No existing assertions were weakened or removed.
  sufficiency: >-
    AC1 covers successful and rejected refresh responses, persisted read-back, retained credentials and business settings, and browser reload. AC2 covers JSON reset, database failure behavior, and email/calendar recipient paths with providers mocked. AC3 measures the checkout budget and uses fresh DB reads for SMS config, ADMIN whitelist metadata, and email; it proves savepoint rollback after a real one-row write, verifies best-effort phone plus authoritative email failure behavior, and exercises both deterministic save-order interleavings while preserving the latest prompt and Gmail fields.
  offline:
    status: pending
    reason: >-
      The prior implementation passed scripts/verify_change.sh for commit
      7f2b99a79494951803cdc8b13050410308cfd762 against target
      53ea4ce734294ec21d5334685d27ec751e3df7d8: 2518 unit/integration tests and 723 E2E tests passed
      with zero failures, errors, skips, xfails, or xpasses. The final race-fix head still needs the
      exact-main PR verifier; the local database-backed setup cannot start because sandbox policy
      denies loopback PostgreSQL. Production p95 latency and live deployment behavior remain outside
      this offline result.
    evidence: []
