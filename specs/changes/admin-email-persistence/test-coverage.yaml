schema: 1
feature: changes/admin-email-persistence
acceptance:
- id: AC1
  behavior: A successful admin email save survives an overlapping Gmail token refresh and browser reload.
  preconditions:
  - Isolated synthetic configuration with an existing sender, recipient, and encrypted Google credentials
  - Google refresh response is held until the admin save has returned success
  success:
  - Fresh API and JSON-file reads retain the newly saved recipient and routine-copy preference
  - A successful refresh stores the new encrypted access token and expiry
  - A complete browser reload displays the newly saved recipient
  failure:
  - A rejected refresh preserves the newly saved recipient and existing token fields
  invariants:
  - Refresh token and unrelated business settings remain unchanged
  - Provider request semantics and notification policy remain unchanged
  - Configuration save emits no notification or live provider request
  tests:
  - tests/test_gmail_service.py::test_refresh_gmail_token_success
  - tests/test_admin_email_persistence.py::test_admin_email_save_survives_token_refresh[200]
  - tests/test_admin_email_persistence.py::test_admin_email_save_survives_token_refresh[403]
  - e2e/test_admin_mail_oauth.py::test_admin_email_save_survives_background_refresh_and_page_reload
  - e2e/test_admin_mail_oauth.py::test_legacy_settings_render_google_only_and_save_after_reload
  layer:
  - unit
  - http
  - browser
  - provider_contract
  - composed
  live_acceptance:
    status: not_required
    reason: The changed contract is local settings persistence during a captured token response; no external
      delivery or provider request behavior changes. Confirmation of the deployed incident remains a separate
      pending diagnostic task.
    scenarios: []
omitted_layers:
  database: The email and system Google tokens use the existing JSON configuration file; relational state is
    unchanged.
  migration: No schema or stored format changes.
  targeted: The deterministic API and browser interleaving directly reproduces the lost update; no separate
    performance or accessibility contract changes.
review:
  red: 'Before implementation, ./run_tests.sh --file tests/test_admin_email_persistence.py --tb=short produced
    1 failed and 1 passed: the successful-refresh case returned old-admin@example.test in a fresh GET after
    Save had returned 200 for new-admin@example.test.'
  green: 'The focused browser regression passed (1 passed). After correcting test-file isolation, ./run_tests.sh
    --verify --tb=short -q passed all 2488 unit/integration cases and all 716 E2E cases, including the new
    regressions; both suite exits were 0. Publication verification subsequently passed for isolated commit
    8768e0505b87a99d8570452c61114f3f52caa789 against main c04d72c8b237820ef72e7c5da2c5bf747327b54f: 2481 unit/integration
    and 714 E2E, including 134 browser journeys, with zero failures/errors/skips/xfails/xpasses.'
  test_changes: Additive API/browser regressions and stronger token-only update assertions replace an old mock-called
    assertion. A first combined run found the new API test leaking its preference into a later test; the regression
    now owns per-test temporary configuration and prompt files. No behavioral assertions were weakened; no
    tests were removed, skipped, or marked xfail.
  sufficiency: Covers successful and rejected refresh responses, fresh persisted read-back, retained tokens
    and business settings, and browser save/reload with an overlapping background refresh.
  offline:
    status: pending
    reason: The Oct 25 standalone commit has historical verification evidence above. The combined integration candidate includes additional branch changes and requires exact-candidate verification before publication.
    evidence: []
