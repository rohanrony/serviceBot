<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · BayFull</title>
  <link rel="stylesheet" href="/portal/login.css">
  <script src="/portal/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">B</div>
    <p class="eyebrow">BAYFULL ADMIN</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage your service portal.</p>
    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
